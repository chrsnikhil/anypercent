# Any% device: RetroArch base config (~anypercent/.config/retroarch/retroarch.cfg).
# The launcher appends its own per-launch settings with --appendconfig (runner.py).
# No X/Wayland: KMS/DRM video on the DSI panel, udev (evdev) input so a USB keyboard or pad works from a VT.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_scale_integer = "false"
video_aspect_ratio_auto = "true"
video_smooth = "false"
video_threaded = "false"
video_font_enable = "false"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
audio_driver = "alsa"
audio_enable = "true"
menu_driver = "rgui"
pause_nonactive = "false"
config_save_on_exit = "false"
savestate_auto_load = "false"
savestate_auto_save = "false"
network_cmd_enable = "false"
notification_show_autoconfig = "false"
notification_show_config_override_load = "false"
notification_show_remap_load = "false"
menu_show_load_content_animation = "false"
# Keyboard = the launcher's mapping: arrows, X = A, Z = B, A = L, S = R, Enter = Start, Backspace = Select.
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_l = "a"
input_player1_r = "s"
input_player1_start = "enter"
input_player1_select = "backspace"
# Esc quits back to the launcher (L + R does too: on a pad by RetroArch's quit combo, set by the launcher;
# on the touch overlay and the GPIO buttons by holding Esc). F1 opens the RetroArch menu.
input_exit_emulator = "escape"
input_menu_toggle = "f1"
# Hotkeys that would otherwise sit on the letters used above.
input_save_state = "nul"
input_load_state = "nul"
input_state_slot_increase = "nul"
input_state_slot_decrease = "nul"
input_toggle_fast_forward = "nul"
input_hold_fast_forward = "nul"
input_rewind = "nul"
input_pause_toggle = "nul"
input_screenshot = "nul"
input_toggle_fullscreen = "nul"
