# Any%: PS5 DualSense (Bluetooth or USB) for RetroArch's udev joypad driver.
# Button numbers are the evdev order hid-playstation reports (checked on the device: 13 buttons, 1 hat, 6 axes):
# 0 cross, 1 circle, 2 triangle, 3 square, 4 L1, 5 R1, 6 L2, 7 R2, 8 Create, 9 Options, 10 PS, 11 L3, 12 R3.
# Cross is A and circle is B, the same as in the launcher. L1 + R1 quits to the launcher (the launcher's quit
# combo). PS belongs to the home key (device/homekey.py: hold 2 s for the launcher, PS + D-pad for volume
# and brightness), so it does not open the RetroArch menu; the case's X button (F1) still does.
input_driver = "udev"
input_device = "DualSense Wireless Controller"
input_vendor_id = "1356"
input_product_id = "3302"
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
