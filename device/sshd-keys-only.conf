# Any%: installed as /etc/ssh/sshd_config.d/01-anypercent-keys-only.conf. Key login only.
# sshd keeps the FIRST value it reads, and this sorts before cloud-init's 50-cloud-init.conf (PasswordAuthentication yes).
# The laptop's key is ~/.ssh/anypercent_ed25519 (device/anypercent_ssh.py); see docs/device-setup.md for a fresh card.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
